# Configuración de clamd para Terra Link (P0-018/P0-019). Se monta en el servicio `scanner`.
# Partimos de los valores del contenedor oficial y fijamos explícitamente los límites para que un análisis
# INCOMPLETO nunca se interprete como limpio:
# - AlertExceedsMax yes: si se alcanza un límite (tamaño, recursión, número de archivos, tiempo), clamd
#   responde «Heuristics.Limits.Exceeded.* FOUND»; la API lo registra como FAILED (SCAN_INCOMPLETE), no como
#   limpio ni como malware.
# - StreamMaxLength: algo por encima del máximo de documentos (10 MiB) para acotar memoria; por encima,
#   clamd devuelve «INSTREAM size limit exceeded» → FAILED (SCANNER_SIZE_LIMIT).
# - MaxScanTime menor que el tiempo de espera del cliente (30 s).
# - MaxFileSize/MaxScanSize se mantienen en los valores por defecto (100M/400M), muy por encima del máximo de
#   documentos: COMPROBADO (2026-10-10, ClamAV 1.4.6) que un objeto interno mayor que MaxFileSize se omite y
#   la respuesta es «OK» aunque AlertExceedsMax esté activo; en cambio, MaxRecursion excedido sí se alerta.
#   Limitación residual documentada en docs/12.
LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
StreamMaxLength 16M
MaxFileSize 100M
MaxScanSize 400M
MaxRecursion 17
MaxFiles 10000
MaxScanTime 25000
AlertExceedsMax yes
HeuristicAlerts yes
