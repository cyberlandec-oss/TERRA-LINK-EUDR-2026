# Frontera de ejemplo para el terminador TLS/proxy autorizado.
# El TLS termina delante de este bloque; el proxy nunca acepta XFF del cliente.
events {}
http {
  server {
    listen 8080;
    location / {
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_pass http://api:4000;
    }
  }
}
