# Servicio LOCAL de cartografía (A-01): sirve teselas vectoriales (PMTiles), estilo y fuentes desde el volumen map-data.
# No hace proxy a nadie: si un archivo no existe devuelve 404 y la web lo muestra como «cartografía no disponible».
# Solo contiene datos públicos de OpenStreetMap; no recibe ni guarda coordenadas, parcelas, fotografías ni identidades.
server {
    listen 80;
    root /usr/share/nginx/html;
    default_type application/octet-stream;
    # Los PMTiles se leen por rangos de bytes; nginx sirve Range de forma nativa en archivos estáticos.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range, If-Match, If-None-Match" always;
    add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Accept-Ranges, ETag" always;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    types { application/json json; application/x-protobuf pbf; }

    location = /salud { default_type text/plain; return 200 "ok\n"; }
    # Lista de permitidos: solo lo que consume el mapa. Las fuentes crudas y temporales del volumen (fuentes/, data/) no se publican.
    location ~ ^/(tiles/ecuador\.pmtiles|estilo\.json|metadata\.json|fonts/[^/]+/[0-9]+-[0-9]+\.pbf)$ { try_files $uri =404; autoindex off; }
    location / { return 404; }
}
